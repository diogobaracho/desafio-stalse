# pip install pre-commit (or `uv tool install pre-commit`) && pre-commit install
# Local hooks reuse each component's pinned toolchain (uv / npm), so versions never drift from CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^deploy/k8s/ # Kustomize patches / anchors are validated by `make k8s-validate`
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-backend
        name: ruff (backend)
        entry: bash -c 'cd backend && uv run ruff check --fix . && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-data
        name: ruff (data)
        entry: bash -c 'cd data && uv run ruff check --fix . && uv run ruff format .'
        language: system
        files: ^data/.*\.py$
        pass_filenames: false
      - id: prettier-frontend
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/
      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint --max-warnings=0 "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs)$
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive infra/terraform
        language: system
        files: \.tf$
        pass_filenames: false
