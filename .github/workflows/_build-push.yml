# Reusable: build one component image and push it to the environment's ACR (GitHub OIDC,
# no registry passwords). Tagged with the commit SHA; outputs the immutable digest.
name: build-push

on:
  workflow_call:
    inputs:
      component:
        description: backend | frontend | data
        type: string
        required: true
      environment:
        type: string
        required: true
    outputs:
      image:
        description: Full image reference pinned by digest
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.component }}
          push: true
          # The same image runs in every environment; the browser API base is /api (ingress).
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
            APP_VERSION=${{ github.sha }}
          tags: ${{ vars.ACR_LOGIN_SERVER }}/stalse-${{ inputs.component == 'data' && 'etl' || inputs.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
          provenance: true
          sbom: true
      - id: ref
        run: |
          name="stalse-${{ inputs.component == 'data' && 'etl' || inputs.component }}"
          echo "image=${{ vars.ACR_LOGIN_SERVER }}/${name}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
