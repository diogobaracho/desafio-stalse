version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups: { backend: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /data
    schedule: { interval: weekly }
    groups: { data: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /data]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: [/infra/terraform/bootstrap, /infra/terraform/envs/dev, /infra/terraform/envs/prod]
    schedule: { interval: weekly }
