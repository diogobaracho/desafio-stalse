# Local stack: docker compose up --build  (or `make compose-up`)
#   frontend http://localhost:3000 · API http://localhost:8000/docs · n8n http://localhost:5678
#
# Each service builds from its own component directory (independent images).
name: stalse

services:
  etl:
    build: ./data
    # One-shot job: (re)generates metrics.json into the shared volume, then exits.
    volumes:
      - metrics:/output
    restart: "no"

  backend:
    build:
      context: ./backend
    command: ["sh", "-c", "python -m app.db.init && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      ENVIRONMENT: local
      DATABASE_URL: sqlite:////app/var/stalse.db
      METRICS_FILE_PATH: /app/metrics/metrics.json
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/stalse-ticket-updated
      N8N_WEBHOOK_TIMEOUT_SECONDS: "3"
      CORS_ORIGINS: http://localhost:3000
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      READ_ONLY_MODE: ${READ_ONLY_MODE:-false}
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/var
      - metrics:/app/metrics:ro
    depends_on:
      etl:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # No ingress locally: the browser calls the API directly.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000
      BRAND_CONFIG_PATH: ${BRAND_CONFIG_PATH:-}
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/compose/brand:/etc/stalse/brand:ro
    depends_on:
      backend:
        condition: service_healthy

  n8n-init:
    image: n8nio/n8n:2.42.5
    # Imports + publishes the workflow before n8n starts (idempotent: same workflow id).
    entrypoint: ["sh", "-c", "n8n import:workflow --input=/workflows/workflow.json && n8n publish:workflow --id=stalseTicketUpdated"]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    restart: "no"

  n8n:
    image: n8nio/n8n:2.42.5
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully

volumes:
  backend-data:
  metrics:
  n8n-data:
