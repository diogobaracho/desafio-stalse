# n8n runs only in local environments (spec 004). The workflow is imported + published by an
# init container from the n8n-workflow ConfigMap.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: import-workflow
          image: n8nio/n8n:2.42.5
          command: ["sh", "-c", "n8n import:workflow --input=/workflows/workflow.json && n8n publish:workflow --id=stalseTicketUpdated"]
          volumeMounts:
            - { name: data, mountPath: /home/node/.n8n }
            - { name: workflow, mountPath: /workflows, readOnly: true }
      containers:
        - name: n8n
          image: n8nio/n8n:2.42.5
          ports:
            - { name: http, containerPort: 5678 }
          env:
            - { name: N8N_SECURE_COOKIE, value: "false" }
            - { name: N8N_PERSONALIZATION_ENABLED, value: "false" }
            - { name: N8N_DIAGNOSTICS_ENABLED, value: "false" }
            - { name: GENERIC_TIMEZONE, value: America/Sao_Paulo }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          volumeMounts:
            - { name: data, mountPath: /home/node/.n8n }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: n8n-data }
        - name: workflow
          configMap: { name: n8n-workflow }
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app.kubernetes.io/name: n8n
  ports:
    - { name: http, port: 5678, targetPort: http }
