# Daily ETL run writing metrics.json to the shared volume the backend reads.
# Bootstrap/manual run: kubectl create job --from=cronjob/etl etl-manual-$(date +%s) -n stalse
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etl
  labels:
    app.kubernetes.io/name: etl
spec:
  schedule: "0 3 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etl
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: etl
              image: stalse-etl
              env:
                - { name: ETL_OUTPUT, value: /output/metrics.json }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: metrics, mountPath: /output }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: metrics
              persistentVolumeClaim: { claimName: metrics }
