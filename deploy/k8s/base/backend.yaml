apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Migrations + idempotent seed before the API starts (safe to run on every rollout).
        - name: db-init
          image: stalse-backend
          command: ["python", "-m", "app.db.init"]
          envFrom:
            - configMapRef: { name: backend-config }
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: &backendMounts
            - { name: var, mountPath: /app/var }
            - { name: tmp, mountPath: /tmp }
            - { name: metrics, mountPath: /app/metrics, readOnly: true }
          resources: &backendResources
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      containers:
        - name: api
          image: stalse-backend
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: backend-config }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext: *containerSecurity
          volumeMounts: *backendMounts
          resources: *backendResources
      volumes:
        - name: var # SQLite lives here locally; Azure uses PostgreSQL (DATABASE_URL secret)
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: metrics
          persistentVolumeClaim:
            claimName: metrics
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - { name: http, port: 8000, targetPort: http }
