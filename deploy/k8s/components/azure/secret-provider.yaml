# Key Vault secrets mounted as files at /mnt/secrets-store (one file per setting).
# The backend reads them through pydantic-settings (SECRETS_DIR); nothing is copied into
# Kubernetes Secrets or environment variables.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-secrets
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${BACKEND_CLIENT_ID}"
    keyvaultName: "${KEYVAULT_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: database-url
          objectAlias: database_url
          objectType: secret
        - |
          objectName: n8n-webhook-url
          objectAlias: n8n_webhook_url
          objectType: secret
