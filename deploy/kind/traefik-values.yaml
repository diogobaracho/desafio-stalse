# Traefik on kind: NodePort reachable through the kind port mapping (see cluster.yaml).
service:
  type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
providers:
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: false
