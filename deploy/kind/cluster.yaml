# Local Kubernetes cluster for the "local (kubernetes)" environment.
# Traefik's NodePort 30080 is exposed on host port 8080 -> http://stalse.localtest.me:8080
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: stalse
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
